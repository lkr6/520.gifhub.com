        @keyframes floatAround {
            0%   { transform: translateY(0px) rotate(0deg); }
            25%  { transform: translateY(-8px) rotate(3deg); }
            50%  { transform: translateY(4px) rotate(-3deg); }
            75%  { transform: translateY(-4px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* ========== 主卡片容器 ========== */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(255, 105, 135, 0.3), 0 0 120px rgba(255, 182, 193, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        /* 卡片的粉色光晕 */
        .main-card::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 32px;
            padding: 4px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffb6c1, #ff69b4);
            background-size: 300% 300%;
            animation: borderGlow 4s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: exclude;
            mask-composite: exclude;
            z-index: -1;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ========== 标题23 ========== */
        .title-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .number-23 {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b8a, #ff4088, #ff2d78);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 8px rgba(255, 64, 128, 0.5));
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 4px 8px rgba(255, 64, 128, 0.5)); }
            50% { filter: drop-shadow(0 6px 16px rgba(255, 64, 128, 0.85)); }
        }

        .heart-icon {
            font-size: 40px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.18); }
            60% { transform: scale(1); }
        }

        /* ========== 视频容器 ========== */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 比例 */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 105, 135, 0.4);
            margin-bottom: 20px;
            background: #000; /* 视频加载前的黑色背景 */
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* 视频装饰边框 */
        .video-decoration {
            position: absolute;
            inset: -6px;
            border-radius: 24px;
            padding: 6px;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffb6c1, #ff69b4);
            background-size: 300% 300%;
            animation: borderGlow 4s ease infinite;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: exclude;
            mask-composite: exclude;
            z-index: -1;
            pointer-events: none;
        }

        /* ========== 底部小字 ========== */
        .caption {
            color: #e8577c;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .caption span {
            display: inline-block;
            animation: bounce 1.5s ease-in-out infinite;
        }
        .caption span:nth-child(1) { animation-delay: 0s; }
        .caption span:nth-child(2) { animation-delay: 0.1s; }
        .caption span:nth-child(3) { animation-delay: 0.2s; }
        .caption span:nth-child(4) { animation-delay: 0.3s; }
        .caption span:nth-child(5) { animation-delay: 0.4s; }
        .caption span:nth-child(6) { animation-delay: 0.5s; }
        .caption span:nth-child(7) { animation-delay: 0.6s; }
        .caption span:nth-child(8) { animation-delay: 0.7s; }
        .caption span:nth-child(9) { animation-delay: 0.8s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ========== 飘落花瓣 ========== */
        .petal {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            animation: petalFall linear infinite;
            opacity: 0.7;
            font-size: 24px;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(1);
                opacity: 0.8;
            }
            25% {
                transform: translateY(25vh) rotate(90deg) scale(1.2);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) scale(0.9);
            }
            75% {
                transform: translateY(75vh) rotate(270deg) scale(1.1);
            }
            100% {
                transform: translateY(110vh) rotate(360deg) scale(0.6);
                opacity: 0;
            }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .main-card {
                padding: 20px 15px;
                border-radius: 20px;
            }
            .number-23 {
                font-size: 48px;
            }
            .heart-icon {
                font-size: 28px;
            }
            .bg-twenty-three {
                font-size: 20px !important;
            }
            .caption {
                font-size: 13px;
            }
        }
    </style>
